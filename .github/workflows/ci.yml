# Tests of hm3denv on Linux and Windows, with and without the numba kernels,
# plus the Docker test stage (Linux image).
name: hm3denv

on:
  push:
  pull_request:

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
        backend: [numba, numpy]
    runs-on: ${{ matrix.os }}
    env:
      HM3D_ACCEL: ${{ matrix.backend == 'numpy' && '0' || '1' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [ "${{ matrix.backend }}" = "numba" ]; then pip install -e ".[build,test,fast]"; \
          else pip install -e ".[build,test]"; fi
      - name: Test (no workspace data)
        run: python -m pytest -q -m "not workspace"

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image and run the test stage
        run: docker build --target test -t hm3denv:test .
