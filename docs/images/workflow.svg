<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 300" width="980" height="300" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <title>hm3denv features: get-data, build-map and extend-data fill data/datasets; sim and train use them</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a94a6"/>
    </marker>
    <style>
      .box  { fill: #ffffff; stroke: #d0d7e2; stroke-width: 1.5; }
      .hub  { fill: #eef3fb; stroke: #3c78d8; stroke-width: 1.5; }
      .ttl  { fill: #1f2937; font-size: 16px; font-weight: 700; text-anchor: middle; }
      .cmd  { fill: #0f5132; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; text-anchor: middle; }
      .note { fill: #5b6474; font-size: 12.5px; text-anchor: middle; }
      .cmdbg { fill: #eef6f1; }
      .line { stroke: #8a94a6; stroke-width: 1.6; fill: none; marker-end: url(#arr); }
    </style>
  </defs>
  <rect x="0" y="0" width="980" height="300" rx="14" fill="#f6f8fb"/>

  <!-- sources -->
  <rect class="box" x="16" y="16" width="250" height="82" rx="12"/>
  <text class="ttl" x="141" y="42">Download a dataset</text>
  <rect class="cmdbg" x="66" y="52" width="150" height="22" rx="6"/>
  <text class="cmd" x="141" y="68">get-data NAME</text>
  <text class="note" x="141" y="90">from Hugging Face</text>

  <rect class="box" x="16" y="109" width="250" height="82" rx="12"/>
  <text class="ttl" x="141" y="135">Build maps from GLB</text>
  <rect class="cmdbg" x="56" y="145" width="170" height="22" rx="6"/>
  <text class="cmd" x="141" y="161">build-map scene.glb</text>
  <text class="note" x="141" y="183">your own 3D scenes, HM3D</text>

  <rect class="box" x="16" y="202" width="250" height="82" rx="12"/>
  <text class="ttl" x="141" y="228">Continue a dataset</text>
  <rect class="cmdbg" x="41" y="238" width="200" height="22" rx="6"/>
  <text class="cmd" x="141" y="254">extend-data NAME ...</text>
  <text class="note" x="141" y="276">new scenes, tasks, robots</text>

  <!-- hub -->
  <rect class="hub" x="366" y="96" width="230" height="108" rx="12"/>
  <text class="ttl" x="481" y="128">data/datasets/</text>
  <text class="note" x="481" y="152">maps + start/goal tasks,</text>
  <text class="note" x="481" y="170">checked, found by name</text>
  <text class="note" x="481" y="188">(+ bundled demos)</text>

  <path class="line" d="M266,57 C320,57 320,130 362,130"/>
  <path class="line" d="M266,150 L362,150"/>
  <path class="line" d="M266,243 C320,243 320,172 362,172"/>
  <path class="line" d="M420,204 C420,250 300,262 270,250" stroke-dasharray="5 4"/>

  <!-- uses -->
  <rect class="box" x="696" y="40" width="268" height="104" rx="12"/>
  <text class="ttl" x="830" y="66">Open a simulation</text>
  <rect class="cmdbg" x="716" y="76" width="228" height="22" rx="6"/>
  <text class="cmd" x="830" y="92">sim --dataset NAME --view</text>
  <text class="note" x="830" y="116">map, robot, N envs, start/goal;</text>
  <text class="note" x="830" y="134">watch it, or drive it over ZeroMQ</text>

  <rect class="box" x="696" y="160" width="268" height="104" rx="12"/>
  <text class="ttl" x="830" y="186">Train an agent</text>
  <rect class="cmdbg" x="726" y="196" width="208" height="22" rx="6"/>
  <text class="cmd" x="830" y="212">train --config sim.yaml</text>
  <text class="note" x="830" y="236">PPO, then tested on unseen</text>
  <text class="note" x="830" y="254">maps vs random and oracle</text>

  <path class="line" d="M596,130 C650,130 650,92 692,92"/>
  <path class="line" d="M596,172 C650,172 650,212 692,212"/>
</svg>
